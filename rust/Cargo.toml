[package]
name = "ardoise"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ardoise"
path = "src/main.rs"

[dependencies]
# http2: accept h2c from the Caddy proxy (one connection per user, fiche 06).
axum = { version = "0.8", features = ["http2"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal", "sync"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# cors + fs: CorsLayer, and ServeDir/ServeFile serving the built frontend
# (dist/) as the SPA fallback.
tower-http = { version = "0.6", features = ["cors", "fs"] }
# default-features=false: `async-await-macro` would drag in futures-macro,
# absent from the local crates.io mirror. std is all the stream combinators need.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
rand = "0.8"
base64 = "0.22"
p256 = { version = "0.13", features = ["ecdsa", "ecdh"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = true
strip = true
