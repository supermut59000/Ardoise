services:
  mariadb:
    image: mariadb:11.2
    container_name: ardoise-mariadb
    # No host port: only the backend reaches MariaDB over the compose network.
    # Docker bypasses UFW when publishing ports, so exposing the DB here would put
    # it on the internet. For local DB access add: ports: ["127.0.0.1:3307:3306"]
    # Secrets come from an untracked .env next to this file (see DEPLOY.md), so
    # git pull never conflicts with server-local edits. Defaults suit local dev.
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ardoise
      MYSQL_USER: ardoise
      MYSQL_PASSWORD: ${DB_PASSWORD:-ardoise}
    volumes:
      - mariadb-data:/var/lib/mysql
    restart: unless-stopped
    networks:
      - ardoise-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ardoise-backend
    ports:
      # Loopback only: reachable for local dev, never from the internet.
      - "127.0.0.1:8065:8000"
    env_file:
      - ./backend/.env.docker
    volumes:
      # Live source mount for dev: with DEBUG=true, run.py runs uvicorn --reload,
      # so code changes apply without rebuilding the image.
      - ./backend:/app
    environment:
      - PYTHONPATH=/app
      # Overrides the .env.docker defaults; values come from the untracked .env.
      - API_KEY=${API_KEY:-}
      - DB_PASSWORD=${DB_PASSWORD:-ardoise}
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - ardoise-network

  frontend:
    build:
      context: ./frontend-react
      dockerfile: Dockerfile
    container_name: ardoise-frontend
    ports:
      # Loopback only: Caddy reverse-proxies to 127.0.0.1:3060. Nothing else is
      # exposed to the internet.
      - "127.0.0.1:3060:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - ardoise-network

networks:
  ardoise-network:
    driver: bridge

volumes:
  mariadb-data:
    driver: local
